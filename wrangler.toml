name = "distributinon-site"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Cloudflare Workers Static Assets
[assets]
directory = "./public"
binding = "ASSETS"

# Environment Variables
[vars]
DEFAULT_ADMIN_TOKEN = "xiaoma2026"
ADMIN_TOKEN = "xiaoma2026"

# Cloudflare R2 存储桶绑定
[[r2_buckets]]
binding = "RELEASES_BUCKET"
bucket_name = "distribute-web"
